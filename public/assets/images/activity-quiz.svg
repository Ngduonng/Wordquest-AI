<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="quizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Backdrop soft circle -->
  <circle cx="100" cy="100" r="90" fill="url(#quizBg)" />
  <circle cx="100" cy="100" r="82" fill="#fed7aa" opacity="0.4"/>

  <!-- Gamepad body -->
  <path d="M 45 92 
           C 40 135 60 148 78 135 
           L 90 125 
           L 110 125 
           L 122 135 
           C 140 148 160 135 155 92 
           C 152 70 135 65 100 65 
           C 65 65 48 70 45 92 Z" 
        fill="url(#padGrad)" filter="drop-shadow(0 6px 8px rgba(234, 88, 12, 0.25))"/>

  <!-- Highlight gloss on top -->
  <path d="M 60 75 Q 100 70 140 75" stroke="#ffedd5" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- D-Pad (Left controls) -->
  <rect x="64" y="90" width="8" height="24" rx="3" fill="#ffffff" />
  <rect x="56" y="98" width="24" height="8" rx="3" fill="#ffffff" />

  <!-- Action Buttons (Right) -->
  <circle cx="132" cy="94" r="5" fill="#facc15" />
  <circle cx="142" cy="104" r="5" fill="#38bdf8" />
  <circle cx="122" cy="104" r="5" fill="#4ade80" />
  <circle cx="132" cy="114" r="5" fill="#f43f5e" />

  <!-- Quiz Lightbulb / Insight Spark on top of gamepad -->
  <circle cx="100" cy="45" r="16" fill="#fde047" filter="drop-shadow(0 0 8px #f59e0b)"/>
  <rect x="96" y="59" width="8" height="6" rx="2" fill="#94a3b8" />
  <!-- Rays of lightbulb -->
  <line x1="100" y1="22" x2="100" y2="16" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="30" x2="74" y2="24" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="120" y1="30" x2="126" y2="24" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Stars around -->
  <polygon points="32,60 34,64 38,64 35,67 36,71 32,68 28,71 29,67 26,64 30,64" fill="#3b82f6"/>
  <polygon points="168,60 170,64 174,64 171,67 172,71 168,68 164,71 165,67 162,64 166,64" fill="#10b981"/>
</svg>
