<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldCup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="trophyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Backdrop soft circle -->
  <circle cx="100" cy="100" r="90" fill="#fffbeb" />
  <circle cx="100" cy="100" r="82" fill="#fef3c7" opacity="0.6"/>

  <!-- Pedestal Base (Chân cúp) -->
  <polygon points="62,176 138,176 130,154 70,154" fill="#1e293b" />
  <rect x="74" y="148" width="52" height="8" rx="2" fill="#334155" />
  <!-- Golden base plate -->
  <rect x="80" y="160" width="40" height="10" rx="2" fill="#facc15" />

  <!-- Cup Stem -->
  <path d="M 94 116 L 94 148 L 106 148 L 106 116 Z" fill="url(#goldCup)" />
  <ellipse cx="100" cy="148" rx="14" ry="4" fill="#ca8a04" />

  <!-- Left Handle (Quai cúp) -->
  <path d="M 64 64 C 36 64 36 104 68 104" stroke="url(#goldCup)" stroke-width="8" fill="none" stroke-linecap="round"/>
  <!-- Right Handle -->
  <path d="M 136 64 C 164 64 164 104 132 104" stroke="url(#goldCup)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- Cup Bowl (Thân cúp) -->
  <path d="M 58 48 
           L 142 48 
           C 142 88 126 118 100 118 
           C 74 118 58 88 58 48 Z" 
        fill="url(#goldCup)" filter="url(#trophyGlow)"/>

  <!-- Cup Rim Oval -->
  <ellipse cx="100" cy="48" rx="42" ry="8" fill="#fef08a" />
  <ellipse cx="100" cy="48" rx="38" ry="6" fill="#eab308" />

  <!-- Shimmer Highlight on Cup -->
  <path d="M 72 58 C 72 82 82 98 94 106" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Central Star Emblem on Trophy -->
  <polygon points="100,68 103,77 113,77 105,83 108,92 100,86 92,92 95,83 87,77 97,77" fill="#ffffff" filter="drop-shadow(0 0 3px #ca8a04)"/>

  <!-- Blue Victory Ribbon Streamers -->
  <path d="M 55 120 L 40 160 L 52 152 L 64 162 L 60 120 Z" fill="url(#ribbonGrad)" />
  <path d="M 145 120 L 160 160 L 148 152 L 136 162 L 140 120 Z" fill="url(#ribbonGrad)" />

  <!-- Sparkling Celebration Stars -->
  <polygon points="40,35 43,41 49,41 44,45 46,51 40,47 34,51 36,45 31,41 37,41" fill="#facc15"/>
  <polygon points="160,35 163,41 169,41 164,45 166,51 160,47 154,51 156,45 151,41 157,41" fill="#facc15"/>
  <circle cx="100" cy="22" r="3" fill="#38bdf8" />
</svg>
