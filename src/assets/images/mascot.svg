<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Aura / Soft backdrop circle -->
  <circle cx="100" cy="100" r="90" fill="#eff6ff" />
  <circle cx="100" cy="100" r="82" fill="#dbeafe" opacity="0.6"/>

  <!-- Feet -->
  <ellipse cx="80" cy="172" rx="14" ry="7" fill="#f59e0b" />
  <ellipse cx="120" cy="172" rx="14" ry="7" fill="#f59e0b" />

  <!-- Body -->
  <ellipse cx="100" cy="112" rx="64" ry="68" fill="url(#bodyGrad)" filter="url(#softGlow)"/>

  <!-- Belly -->
  <ellipse cx="100" cy="126" rx="42" ry="46" fill="url(#bellyGrad)" />
  <!-- Feather marks on belly -->
  <path d="M 88 116 Q 100 124 112 116" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 82 132 Q 100 142 118 132" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 90 148 Q 100 156 110 148" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Left Wing (waving) -->
  <path d="M 40 102 C 20 80 14 110 32 136 C 42 124 44 112 40 102 Z" fill="url(#wingGrad)" />
  <!-- Right Wing -->
  <path d="M 160 102 C 180 80 186 110 168 136 C 158 124 156 112 160 102 Z" fill="url(#wingGrad)" />

  <!-- Eyes - Left -->
  <circle cx="76" cy="88" r="24" fill="#ffffff" />
  <circle cx="78" cy="88" r="14" fill="#1e293b" />
  <circle cx="73" cy="83" r="5" fill="#38bdf8" />
  <circle cx="82" cy="85" r="4" fill="#ffffff" />
  <circle cx="75" cy="94" r="2" fill="#ffffff" />

  <!-- Eyes - Right -->
  <circle cx="124" cy="88" r="24" fill="#ffffff" />
  <circle cx="122" cy="88" r="14" fill="#1e293b" />
  <circle cx="119" cy="83" r="5" fill="#38bdf8" />
  <circle cx="126" cy="85" r="4" fill="#ffffff" />
  <circle cx="121" cy="94" r="2" fill="#ffffff" />

  <!-- Cute Glasses -->
  <circle cx="76" cy="88" r="25" fill="none" stroke="#f59e0b" stroke-width="3.5" />
  <circle cx="124" cy="88" r="25" fill="none" stroke="#f59e0b" stroke-width="3.5" />
  <path d="M 101 88 L 99 88" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" />

  <!-- Cute Beak -->
  <polygon points="100,98 90,112 110,112" fill="#ea580c" />
  <polygon points="100,102 93,112 107,112" fill="#f97316" />

  <!-- Rosy Cheeks -->
  <ellipse cx="52" cy="110" rx="9" ry="5" fill="#f43f5e" opacity="0.45" />
  <ellipse cx="148" cy="110" rx="9" ry="5" fill="#f43f5e" opacity="0.45" />

  <!-- Graduation Cap (Mũ cử nhân) -->
  <polygon points="100,24 154,42 100,60 46,42" fill="#1e1b4b" />
  <polygon points="100,28 146,42 100,56 54,42" fill="#312e81" />
  <!-- Cap Skull Base -->
  <path d="M 72 48 Q 100 62 128 48 L 128 58 Q 100 70 72 58 Z" fill="#1e1b4b" />
  <!-- Tassel / Dây tua vàng -->
  <circle cx="100" cy="42" r="3.5" fill="#f59e0b" />
  <path d="M 100 42 C 122 46 138 58 140 76" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="137" y="74" width="6" height="12" rx="2" fill="#f59e0b" />

  <!-- Sparkle stars -->
  <path d="M 24 50 L 26 44 L 32 42 L 26 40 L 24 34 L 22 40 L 16 42 L 22 44 Z" fill="#fbbf24"/>
  <path d="M 176 60 L 178 55 L 183 53 L 178 51 L 176 46 L 174 51 L 169 53 L 174 55 Z" fill="#38bdf8"/>
</svg>
