<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="maneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="lionBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Backdrop soft circle -->
  <circle cx="100" cy="100" r="90" fill="#fffbeb" />
  <circle cx="100" cy="100" r="82" fill="#fef3c7" opacity="0.6"/>

  <!-- Fluffy Mane (Bờm sư tử dễ thương) -->
  <circle cx="100" cy="95" r="62" fill="url(#maneGrad)" />
  <!-- Mane tufts -->
  <circle cx="60" cy="55" r="20" fill="url(#maneGrad)" />
  <circle cx="100" cy="40" r="20" fill="url(#maneGrad)" />
  <circle cx="140" cy="55" r="20" fill="url(#maneGrad)" />
  <circle cx="160" cy="95" r="20" fill="url(#maneGrad)" />
  <circle cx="140" cy="135" r="20" fill="url(#maneGrad)" />
  <circle cx="60" cy="135" r="20" fill="url(#maneGrad)" />
  <circle cx="40" cy="95" r="20" fill="url(#maneGrad)" />

  <!-- Body -->
  <ellipse cx="100" cy="148" rx="42" ry="34" fill="url(#lionBody)" />
  <!-- Paws -->
  <ellipse cx="78" cy="172" rx="14" ry="10" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
  <ellipse cx="122" cy="172" rx="14" ry="10" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>

  <!-- Ears -->
  <circle cx="68" cy="62" r="14" fill="url(#lionBody)" />
  <circle cx="68" cy="62" r="8" fill="#fed7aa" />
  <circle cx="132" cy="62" r="14" fill="url(#lionBody)" />
  <circle cx="132" cy="62" r="8" fill="#fed7aa" />

  <!-- Head -->
  <circle cx="100" cy="95" r="44" fill="url(#lionBody)" />

  <!-- Snout / Mõm -->
  <ellipse cx="100" cy="105" rx="20" ry="15" fill="#fef9c3" />

  <!-- Cute big shiny eyes -->
  <circle cx="82" cy="88" r="9" fill="#1e293b" />
  <circle cx="80" cy="85" r="3.5" fill="#ffffff" />
  <circle cx="84" cy="90" r="1.5" fill="#ffffff" />

  <circle cx="118" cy="88" r="9" fill="#1e293b" />
  <circle cx="116" cy="85" r="3.5" fill="#ffffff" />
  <circle cx="120" cy="90" r="1.5" fill="#ffffff" />

  <!-- Brown Nose & Mouth -->
  <polygon points="100,100 93,94 107,94" fill="#78350f" />
  <path d="M 94 105 Q 100 110 106 105" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <circle cx="68" cy="104" r="6" fill="#fb7185" opacity="0.5"/>
  <circle cx="132" cy="104" r="6" fill="#fb7185" opacity="0.5"/>
</svg>
